name: Build and Release

on:
  push:
    branches: [main, master]
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: totp-auth
            asset_name: totp-auth-linux-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: totp-auth.exe
            asset_name: totp-auth-windows-amd64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: totp-auth
            asset_name: totp-auth-macos-amd64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        id: build
        continue-on-error: true
        run: cargo build --release --target ${{ matrix.target }} 2>&1 | tee build_output.txt; exit ${PIPESTATUS[0]}

      - name: Upload build output as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output-${{ matrix.os }}
          path: build_output.txt

      - name: Upload binary as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Upload binary to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          asset_name: ${{ matrix.asset_name }}
          tag: ${{ github.ref_name }}
          overwrite: true

  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate release notes
        id: notes
        run: |
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          echo "## TOTP Auth v${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "Desktop TOTP 2FA authenticator built with egui." >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "### Downloads" >> $GITHUB_ENV
          echo "- **Linux**: \`totp-auth-linux-amd64\`" >> $GITHUB_ENV
          echo "- **Windows**: \`totp-auth-windows-amd64.exe\`" >> $GITHUB_ENV
          echo "- **macOS**: \`totp-auth-macos-amd64\`" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: TOTP Auth v${{ github.ref_name }}
          body: ${{ env.RELEASE_NOTES }}
          draft: false
          prerelease: false
